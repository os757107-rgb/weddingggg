<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#5b5237;--paper:#f6e9df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Josefin Sans","Segoe UI",Arial,sans-serif;font-weight:300}
.page{max-width:480px;margin:0 auto;overflow:hidden;background:var(--paper)}
.sc{position:relative;width:100%;container-type:inline-size;background-size:100% 100%;background-repeat:no-repeat}
.t{position:absolute;left:50%;transform:translate(-50%,-50%);text-align:center;line-height:1.18;width:max-content;max-width:84%}
.script{font-family:Allura,"Snell Roundhand","Brush Script MT",cursive;font-weight:400}
sup{font-size:.55em;vertical-align:.55em;line-height:0}
.names{display:flex;align-items:flex-start;justify-content:center;gap:1.6cqw;font-size:8.8cqw;line-height:1}
.names .col{display:flex;flex-direction:column;align-items:center}
.names small{font-family:"Josefin Sans",sans-serif;font-size:3.1cqw;letter-spacing:.06em;margin-top:.6cqw;text-transform:uppercase}
.amp{font-family:"Josefin Sans",sans-serif;font-size:5cqw;margin-top:3.6cqw}
.cd{display:flex;justify-content:space-between;width:57%;font-size:8.6cqw;line-height:1;direction:ltr}
.cd .u{display:flex;flex-direction:column;align-items:center;min-width:12cqw}
.cd .u i{font-style:normal;font-size:1.9cqw;letter-spacing:.04em;margin-top:2.4cqw;text-transform:uppercase}
.hit{position:absolute;transform:translate(-50%,-50%);display:block;border-radius:30px}
.hit:focus-visible{outline:3px solid #b8954f;outline-offset:3px}
.rsvp{padding:44px 28px 36px;text-align:center;background:linear-gradient(var(--paper),#f1ddd2)}
.rsvp h2{margin:0;font-family:Allura,cursive;font-weight:400;font-size:46px;color:var(--ink)}
.rsvp p{margin:4px 0 14px;font-size:17px}
.rsvp input{width:100%;font:inherit;font-size:17px;padding:11px 14px;margin:6px 0;border:1px solid #b9a67a;border-radius:12px;background:#fffaf4;color:var(--ink)}
.btn{display:inline-block;margin-top:10px;padding:11px 34px;border-radius:30px;background:#5a5128;color:#fff6e8;text-decoration:none;font-size:18px}
.btn:focus-visible{outline:3px solid #b8954f;outline-offset:3px}
.credit{padding:6px 0 28px;text-align:center;font-size:14px;opacity:.75}
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,#fbf1e8,#efd9cc);color:var(--ink);transition:opacity .8s ease,visibility 0s .8s}
.gate.gone{opacity:0;visibility:hidden;pointer-events:none}
.gate-in{max-width:340px}
.gate-mono{width:112px;height:112px;margin:0 auto 18px;border:1.5px solid #b8954f;border-radius:50%;display:grid;place-items:center;font-size:52px;line-height:1;box-shadow:0 0 0 7px #f3d5cf,0 0 0 8px #b8954f}
.gate-names{font-size:50px;line-height:1.1;margin:8px 0}
.gate p{margin:6px 0 22px;font-size:19px;letter-spacing:.04em}
button.btn{border:0;font-family:inherit;cursor:pointer}
.snd{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;background:#5a5128;color:#fff6e8;cursor:pointer;box-shadow:0 4px 12px rgba(60,40,30,.3)}
.snd[hidden]{display:none}
.snd svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snd .x{display:none}.snd.off .x{display:block}.snd.off .w{display:none}
.snd:focus-visible{outline:3px solid #b8954f;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.gate{transition:none}}
.medal{position:absolute;transform:translate(-50%,-50%);width:41cqw;aspect-ratio:1;border-radius:50%;padding:2cqw;background:#fffaf4;border:2px solid #b8954f;box-shadow:0 0 0 1.1cqw #f3d5cf,0 0 0 1.45cqw #b8954f,0 2cqw 3cqw rgba(120,70,60,.25)}
.medal::before{content:"";position:absolute;inset:.8cqw;border:1px dashed #d98f8a;border-radius:50%;pointer-events:none}
.medal img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.medal .gem{position:absolute;left:50%;top:-4.4cqw;width:3.6cqw;height:3.6cqw;margin-left:-1.8cqw;background:#b8954f;transform:rotate(45deg);border:.5cqw solid #fffaf4;box-shadow:0 0 0 1px #b8954f}
.plainpic{position:absolute;transform:translate(-50%,-50%);width:39cqw;aspect-ratio:630/550}
.plainpic img{width:100%;height:100%;object-fit:cover;display:block}
</style></head><body>
<div class="gate" id="gate"><div class="gate-in"><div class="gate-mono script" id="gMono"></div><div class="gate-names script" id="gNames"></div><p>You are invited to our wedding</p><button class="btn" id="openBtn" type="button">Open the invitation</button></div></div>

var $=function(i){return document.getElementById(i)};
var d=new Date(CFG.date), mo=["January","February","March","April","May","June","July","August","September","October","November","December"];
function ord(n){var s=["th","st","nd","rd"],v=n%100;return n+"<sup>"+(s[(v-20)%10]||s[v]||s[0])+"</sup>"}
function p2(n){return String(n).padStart(2,"0")}
$("gn").textContent=CFG.groom; $("gl").textContent=CFG.groomLast; $("bn").textContent=CFG.bride; $("bl").textContent=CFG.brideLast;
$("mono").textContent=CFG.groom.charAt(0).toUpperCase()+CFG.bride.charAt(0).toUpperCase();
$("sun").textContent=$("mono").textContent;
$("intro").innerHTML=CFG.intro; $("invite").innerHTML=CFG.invite; $("title").innerHTML=CFG.title;
$("dateBig").innerHTML=ord(d.getDate())+" of "+mo[d.getMonth()]+"<br>"+d.getFullYear();
$("venue").textContent=CFG.venue; $("addr").innerHTML=CFG.address; $("mapBtn").href=CFG.mapUrl;
$("dateShort").textContent=p2(d.getDate())+"."+p2(d.getMonth()+1)+"."+d.getFullYear();
$("weekday").textContent=d.toLocaleDateString("en-US",{weekday:"long"});
var h=d.getHours(); $("time").textContent=((h%12)||12)+"."+p2(d.getMinutes())+" "+(h>=12?"pm":"am");
$("credit").textContent=CFG.credit;
document.title=CFG.groom+" & "+CFG.bride+" — Wedding Invitation";
function tick(){var s=Math.max(0,Math.floor((d-new Date())/1000));
 var v=[[Math.floor(s/86400),"Days"],[p2(Math.floor(s%86400/3600)),"Hours"],[p2(Math.floor(s%3600/60)),"Minutes"],[p2(s%60),"Seconds"]];
 $("cd").innerHTML=v.map(function(x,i){return (i?'<span>:</span>':'')+'<div class="u"><b style="font-weight:300">'+x[0]+'</b><i>'+x[1]+'</i></div>'}).join("")}
tick(); setInterval(tick,1000);
function fit(el,limit,start){var sec=el.closest(".sc"),w=sec.getBoundingClientRect().width,t=el.querySelector(".names")||el,fs=start;
 t.style.fontSize=fs+"cqw";var n=0;while(t.getBoundingClientRect().width>w*limit&&fs>3&&n++<60){fs-=0.25;t.style.fontSize=fs+"cqw"}}
function fitAll(){fit($("namesRow"),0.46,8.8);fit($("dateBig"),0.4,5.6);fit($("venue"),0.8,5.2)}
fitAll();addEventListener("resize",fitAll);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);

function wa(){var n=$("guest").value.trim()||"A guest",c=$("num").value||"1";
 $("wa").href="https://wa.me/"+CFG.whatsapp+"?text="+encodeURIComponent("Hello! "+n+" will attend the wedding of "+CFG.groom+" & "+CFG.bride+" ("+c+" guest(s)).")}
$("guest").addEventListener("input",wa); $("num").addEventListener("input",wa); wa();
/* ---- opening screen + music ---- */
var au=null,wasOn=false,gate=$("gate"),snd=$("snd");
$("gMono").textContent=$("mono").textContent; $("gNames").textContent=CFG.groom+" & "+CFG.bride;
if(CFG.music){au=new Audio(CFG.music);au.loop=true;au.preload="auto";snd.hidden=false}
document.body.style.overflow="hidden";
function setSnd(on){snd.classList.toggle("off",!on);snd.setAttribute("aria-pressed",String(on));snd.setAttribute("aria-label",on?"Mute music":"Play music")}
$("openBtn").addEventListener("click",function(){gate.classList.add("gone");document.body.style.overflow="";
 if(au){want=true;au.play().then(function(){setSnd(true)}).catch(function(){setSnd(false);tryPlay()})}fitAll()});
var want=false;
function retry(){tryPlay()}
function tryPlay(){if(!au||!want||!au.paused)return;au.play().then(function(){setSnd(true)}).catch(function(){["touchstart","click","scroll"].forEach(function(e){addEventListener(e,retry,{once:true,passive:true})})})}
snd.addEventListener("click",function(){if(!au)return;if(au.paused){want=true;au.play().then(function(){setSnd(true)}).catch(function(){})}else{want=false;au.pause();setSnd(false)}});
if(au){au.addEventListener("play",function(){setSnd(true)});au.addEventListener("pause",function(){if(want)setSnd(false)});au.addEventListener("ended",function(){if(want){au.currentTime=0;tryPlay()}});
 ["touchstart","click"].forEach(function(e){addEventListener(e,retry,{passive:true})})}
document.addEventListener("visibilitychange",function(){if(!au)return;if(document.hidden){au.pause()}else{tryPlay()}});
